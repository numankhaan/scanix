name: Native foundation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.14']
        include:
          - os: ubuntu-latest
            python: '3.10'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.91.1 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.91.1 fmt --manifest-path native/Cargo.toml --check
      - run: cargo +1.91.1 clippy --locked --manifest-path native/Cargo.toml --all-targets -- -D warnings
      - run: cargo +1.91.1 test --locked --manifest-path native/Cargo.toml
      - run: cargo +1.91.1 build --release --locked --manifest-path native/Cargo.toml
      - run: python -m pip install --upgrade pip==26.2.1
      - run: python -m pip install -r requirements.txt
      - name: Verify locked dependency license texts against primary cached archives
        run: cargo +1.91.1 fetch --locked --manifest-path native/Cargo.toml
      - name: Check reviewed license and notice contents offline
        run: python -B validation/licensing.py --cached
      - name: Run Python regressions with real native subprocess integration
        run: python -B validation/native_ci.py
  msrv:
    name: Rust minimum version (1.85)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install declared minimum Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal
      - run: cargo +1.85.0 test --locked --manifest-path native/Cargo.toml
      - run: cargo +1.85.0 build --release --locked --manifest-path native/Cargo.toml
