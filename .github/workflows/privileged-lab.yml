name: Privileged lab (opt-in)
on:
  workflow_dispatch:
  push:
    branches: [phase2/scanning-accuracy]
    paths:
      - 'validation/**'
      - '.github/workflows/privileged-lab.yml'
permissions:
  contents: read
jobs:
  isolated-lab:
    # Explicit commit opt-in permits pre-merge execution; workflow_dispatch can
    # also be used once the workflow exists on the repository default branch.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[privileged-lab]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified upstream tag
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, verified upstream tag
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt
      - name: Install isolated lab tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends iproute2 iptables tcpdump
      - name: Build pinned native engine for optional SYN validation
        run: |
          rustup toolchain install 1.91.1 --profile minimal
          cargo +1.91.1 build --release --locked --manifest-path native/Cargo.toml
      - name: Validate states and packet-capture evidence in private namespaces
        run: sudo -- "$(command -v python)" -B validation/privileged_lab.py --output "$RUNNER_TEMP/scanix-lab" --native-binary "$GITHUB_WORKSPACE/native/target/release/scanix-engine" --os-evidence
      - name: Privacy boundary for lab evidence
        run: echo 'Lab checks completed; raw captures/reports are not uploaded automatically.'
